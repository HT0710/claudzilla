name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Every shell suite and every plugin with tests, so a new one cannot be left out.
  suites:
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.list.outputs.suites }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          list=$(printf '%s\n' tests/*.test.sh $(ls -d plugins/*/tests | sed 's|/tests$||') | sed 's/.*/"&"/' | paste -sd, -)
          echo "suites=[$list]" >> "$GITHUB_OUTPUT"

  test:
    needs: suites
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.suites.outputs.suites) }}
    name: ${{ matrix.suite }} (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: ${{ !startsWith(matrix.suite, 'plugins/') }}
        run: bash ${{ matrix.suite }}
      - if: startsWith(matrix.suite, 'plugins/')
        run: npm i -g @anthropic-ai/claude-code@2.1.326
      - if: startsWith(matrix.suite, 'plugins/')
        run: claude plugin test ${{ matrix.suite }}

  # One job, because each macOS job waits for a free GitHub runner on its own.
  macos:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Shell suites
        run: |
          # Stock /bin/bash 3.2, as `#!/usr/bin/env bash` finds on a user's Mac; the runner's PATH has Homebrew bash first.
          mkdir -p "$RUNNER_TEMP/stock" && ln -sf /bin/bash "$RUNNER_TEMP/stock/bash" && export PATH="$RUNNER_TEMP/stock:$PATH"
          bash --version | head -1
          failed=
          for s in tests/*.test.sh; do
            echo "::group::$s"
            bash "$s" || failed="$failed $s"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "::error::failed:$failed"; exit 1; }
      # Installed after the shell suites, so they run without claude on PATH, as on ubuntu.
      - if: ${{ !cancelled() }}
        run: npm i -g @anthropic-ai/claude-code@2.1.326
      - name: Plugin suites
        if: ${{ !cancelled() }}
        run: |
          failed=
          for t in plugins/*/tests; do
            s=${t%/tests}
            echo "::group::$s"
            claude plugin test "$s" || failed="$failed $s"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "::error::failed:$failed"; exit 1; }

  release:
    needs: [test, macos]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag only main's tip, so tags stay in order; a skipped release waits for the next push or a manual run.
          git fetch -q origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo "not main's tip; rerun via workflow_dispatch or wait for the next push"; exit 0; }
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          tag=$(git log --format='%s%n%b' ${last:+$last..}HEAD | sh .github/next-version.sh "$last")
          [ -n "$tag" ] || { echo "no release-worthy commits since ${last:-the start}"; exit 0; }
          git tag "$tag"
          git push origin "$tag"
          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$tag" -q .body)
          gh release create "$tag" --verify-tag --title "$tag" --notes "$(printf '%s\n' "$notes" | sh .github/release-notes.sh)"
