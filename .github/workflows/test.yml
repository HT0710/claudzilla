name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bash tests/hooks.test.sh
      - run: bash tests/trace.test.sh
      - run: bash tests/report.test.sh
      - run: bash tests/install.test.sh
      - run: bash tests/rule-review.test.sh
      - run: bash tests/hud.test.sh
      - run: bash tests/guide.test.sh
      - run: bash tests/visuals.test.sh
      - run: bash tests/release.test.sh

  release:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag only main's tip, so tags stay in order; a skipped release waits for the next push or a manual run.
          git fetch -q origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo "not main's tip; rerun via workflow_dispatch or wait for the next push"; exit 0; }
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          tag=$(git log --format='%s%n%b' ${last:+$last..}HEAD | sh .github/next-version.sh "$last")
          [ -n "$tag" ] || { echo "no release-worthy commits since ${last:-the start}"; exit 0; }
          git tag "$tag"
          git push origin "$tag"
          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$tag" -q .body)
          gh release create "$tag" --verify-tag --title "$tag" --notes "$(printf '%s\n' "$notes" | sh .github/release-notes.sh)"
